# Optional local Postgres for development (if you have Docker):
#   docker compose up -d
# Matches the default DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mariposa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
